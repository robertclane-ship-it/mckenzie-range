function toggleScoreOverride() {
  const hole = activeRound.holes[currentHole - 1];
  if (hole.scoreOverride) {
    // Switch back to auto
    hole.scoreOverride = false;
  } else {
    // Switch to manual; seed with current computed value
    hole.scoreOverride = true;
    hole.score = computeHoleScore(hole) || hole.par;
  }
  debouncedSave();
  renderPlay();
}

function addRecovery() {
  const hole = activeRound.holes[currentHole - 1];
  if (!hole.recoveries) hole.recoveries = [];
  // First recovery inherits the bunker flag if the approach was into a bunker
  const isFirstAndBunker = hole.recoveries.length === 0 && hole.approachBunker;
  hole.recoveries.push({
    type: isFirstAndBunker ? 'bunker' : 'chip',
    result: null,
    bunker: isFirstAndBunker
  });
  debouncedSave();
  renderPlay();
}

function setRecoveryResult(idx, result) {
  const hole = activeRound.holes[currentHole - 1];
  if (!hole.recoveries || !hole.recoveries[idx]) return;
  hole.recoveries[idx].result = hole.recoveries[idx].result === result ? null : result;
  debouncedSave();
  renderPlay();
}

function removeRecovery(idx) {
  const hole = activeRound.holes[currentHole - 1];
  if (!hole.recoveries) return;
  hole.recoveries.splice(idx, 1);
  debouncedSave();
  renderPlay();
}

function setField(field, value) {
  const hole = activeRound.holes[currentHole - 1];
  hole[field] = hole[field] === value ? null : value;
  if (field === 'approach' && value === 'gir') {
    hole.chip = null;
    hole.approachBunker = false;
    hole.recoveries = [];
  }
  if (field === 'tee' && (value === 'fairway' || value === 'penalty')) {
    hole.teeBunker = false;
  }
  if (field === 'secondShot') {
    if (value === 'green') {
      // Second shot reached green — clear any approach data, mark as GIR-in-2
      hole.approach = 'gir';
      hole.approachBunker = false;
      hole.chip = null;
      hole.recoveries = [];
    } else if (value === 'fairway' || value === 'penalty') {
      hole.secondBunker = false;
    }
    // If second shot is no longer 'green', and approach was set to 'gir' from that, clear it
    if (value !== 'green' && hole.approach === 'gir' && hole.par === 5) {
      // Only clear if she's resetting from 'green' state — user must re-log approach
      // Actually safer to leave it and let her decide
    }
  }
  debouncedSave();
  renderPlay();
}

function toggleField(field) {
  const hole = activeRound.holes[currentHole - 1];
  hole[field] = !hole[field];
  debouncedSave();
  renderPlay();
}

function setPutts(p) {
  const hole = activeRound.holes[currentHole - 1];
  hole.putts = hole.putts === p ? null : p;
  if (hole.putts === null || hole.putts < 2) {
    hole.puttMisses = [];
    hole.puttDetails = [];
  } else {
    // Trim puttDetails if she reduced the count
    if (!hole.puttDetails) hole.puttDetails = [];
    if (hole.puttDetails.length > hole.putts - 1) {
      hole.puttDetails = hole.puttDetails.slice(0, hole.putts - 1);
    }
  }
  if (hole.putts === null || hole.putts === 0) {
    hole.firstPuttDistance = null;
  }
  debouncedSave();
  renderPlay();
}

function setFirstPuttDistance(d) {
  const hole = activeRound.holes[currentHole - 1];
  hole.firstPuttDistance = hole.firstPuttDistance === d ? null : d;
  debouncedSave();
  renderPlay();
}

function setHoleDriveDelta(delta) {
  const hole = activeRound.holes[currentHole - 1];
  hole.driveDelta = hole.driveDelta === delta ? null : delta;
  debouncedSave();
  renderPlay();
}

function setPuttDetail(idx, type) {
  const hole = activeRound.holes[currentHole - 1];
  if (!hole.puttDetails) hole.puttDetails = [];
  while (hole.puttDetails.length <= idx) hole.puttDetails.push(null);
  if (hole.puttDetails[idx] && hole.puttDetails[idx].type === type) {
    hole.puttDetails[idx] = null;
  } else {
    hole.puttDetails[idx] = { type, distance: hole.firstPuttDistance };
  }
  // Also keep legacy puttMisses in sync for backwards-compat stats
  hole.puttMisses = (hole.puttDetails || []).filter(d => d).map(d => {
    if (d.type === 'pace-long') return 'long';
    if (d.type === 'pace-short') return 'short';
    if (d.type === 'line-left') return 'left';
    if (d.type === 'line-right') return 'right';
    if (d.type === 'lipped') return 'lipped';
    return null;
  }).filter(Boolean);
  debouncedSave();
  renderPlay();
}

function togglePuttMiss(m) {
  // Legacy — keep for backwards compat but no longer used in new UI
  const hole = activeRound.holes[currentHole - 1];
  hole.puttMisses = hole.puttMisses || [];
  const idx = hole.puttMisses.indexOf(m);
  if (idx >= 0) hole.puttMisses.splice(idx, 1);
  else hole.puttMisses.push(m);
  debouncedSave();
  renderPlay();
}

function appendNote(tag) {
  const hole = activeRound.holes[currentHole - 1];
  hole.notes = (hole.notes ? hole.notes + ' · ' : '') + tag.toLowerCase();
  debouncedSave();
  renderPlay();
}

function updateHoleNote(text) {
  activeRound.holes[currentHole - 1].notes = text;
  debouncedSave();
}

function confirmFinish() {
  showModal({
    title: 'Finish this round?',
    text: `${holesPlayed(activeRound)} holes logged. Save to your history.`,
    confirmText: 'Finish',
    onConfirm: finishRound
  });
}

async function finishRound() {
  activeRound.completed = true;
  activeRound.dateCompleted = new Date().toISOString();
  history.push(activeRound);
  await saveHistory();
  await storageDelete(STORAGE_KEY_ACTIVE);
  activeRound = null;
  currentHole = 1;
  hideModal();

  // Always prompt to back up after every round.
  // Browser storage is not durable. The only protection is a file you have a copy of.
  setTimeout(() => {
    showModal({
      title: 'Back up this round',
      text: 'Round saved on your phone. Tap "Back up" to save a copy you can AirDrop or email to yourself. Phone storage can be cleared by iOS without warning — the backup file is your safety net.',
      confirmText: 'Back up now',
      cancelText: 'Skip',
      onConfirm: () => { hideModal(); exportJSON(); },
      onCancel: () => { hideModal(); showToast('Round saved (not backed up)'); renderPlay(); }
    });
  }, 400);

  renderPlay();
}

function showRoundDetail(id) {
  const r = history.find(x => x.id === id);
  if (!r) return;
  const score = totalScore(r);
  const par = totalPar(r);
  const diff = score - par;
  const diffText = diff === 0 ? 'E' : diff > 0 ? '+'+diff : ''+diff;
  const d = new Date(r.date);
  const dateStr = d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });

  const holesHtml = r.holes.map(h => {
    const hScore = holeScore(h);
    const hDiff = hScore - h.par;
    const hClr = hDiff < 0 ? '#c4452e' : hDiff === 0 ? '#1a3d2e' : '#6a7570';
    let detail = '';
    if (h.tee && h.tee !== 'fairway') detail += `T:${teeLabel(h.tee).toLowerCase()}${h.teeBunker ? '/bunker' : ''} · `;
    if (h.approach && h.approach !== 'gir') detail += `A:${approachLabel(h.approach).toLowerCase()}${h.approachBunker ? '/bunker' : ''} · `;
    if (h.recoveries && h.recoveries.length > 0) detail += `${h.recoveries.length} recov · `;
    if (h.putts !== undefined && h.putts !== null) detail += `${h.putts}p`;
    return `<div style="padding:8px 0; border-bottom:1px solid var(--rule); font-size:12px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline;">
        <span style="font-family:'JetBrains Mono',monospace; color:var(--ink-faint); font-size:11px;">H${h.hole} · par ${h.par}</span>
        <span style="font-weight:700; color:${hClr}; font-size:14px;">${hScore}</span>
      </div>
      ${detail ? `<div style="font-size:10.5px; color:var(--ink-faint); margin-top:2px; font-family:'JetBrains Mono',monospace;">${detail}</div>` : ''}
      ${h.notes ? `<div style="font-size:12px; color:var(--ink-soft); margin-top:2px; font-style:italic;">"${escapeHtml(h.notes)}"</div>` : ''}
    </div>`;
  }).join('');

  const fairways = r.holes.filter(h => h.par !== 3 && h.tee === 'fairway').length;
  const fairwaysAtt = r.holes.filter(h => h.par !== 3 && h.tee !== null).length;
  const girs = r.holes.filter(h => h.approach === 'gir').length;
  const putts = r.holes.reduce((s,h) => s + (h.putts||0), 0);

  document.getElementById('modal-title').textContent = r.course || 'Unnamed';
  document.getElementById('modal-text').innerHTML = `
    <div style="font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:12px;">${dateStr}</div>
    <div style="display:flex; gap:18px; align-items:baseline; margin-bottom:18px;">
      <div style="font-weight:800; font-size:44px; color:var(--fairway); letter-spacing:-0.03em;">${score}</div>
      <div style="font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--ink-faint);">${diffText} · par ${par}</div>
    </div>
    <div class="detail-stat"><span class="detail-label">Fairways</span><span class="detail-value">${fairways}/${fairwaysAtt}</span></div>
    <div class="detail-stat"><span class="detail-label">GIR</span><span class="detail-value">${girs}/18</span></div>
    <div class="detail-stat"><span class="detail-label">Putts</span><span class="detail-value">${putts}</span></div>
    <div style="margin-top:16px; max-height:300px; overflow-y:auto;">${holesHtml}</div>
  `;
  document.getElementById('modal-actions').innerHTML = `
    <button class="modal-btn danger" onclick="confirmDelete('${r.id}')">Delete</button>
    <button class="modal-btn primary" onclick="hideModal()">Close</button>
  `;
  document.getElementById('modal').classList.add('show');
}

function confirmDelete(id) {
  document.getElementById('modal-title').textContent = 'Delete this round?';
  document.getElementById('modal-text').textContent = 'This cannot be undone.';
  document.getElementById('modal-actions').innerHTML = `
    <button class="modal-btn secondary" onclick="hideModal()">Cancel</button>
    <button class="modal-btn danger" onclick="deleteRound('${id}')">Delete</button>
  `;
}

async function deleteRound(id) {
  history = history.filter(r => r.id !== id);
  await saveHistory();
  hideModal();
  renderRounds();
  renderStats();
  showToast('Round deleted');
}

function showModal({ title, text, confirmText='Confirm', cancelText='Cancel', onConfirm, onCancel }) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-text').textContent = text;
  document.getElementById('modal-actions').innerHTML = `
    <button class="modal-btn secondary" id="modal-cancel-btn">${cancelText}</button>
    <button class="modal-btn primary" id="modal-confirm-btn">${confirmText}</button>
  `;
  document.getElementById('modal-confirm-btn').onclick = onConfirm;
  document.getElementById('modal-cancel-btn').onclick = onCancel || hideModal;
  document.getElementById('modal').classList.add('show');
}

function hideModal() { document.getElementById('modal').classList.remove('show'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

async function loadCourseNotes() {

}

async function saveCourseNote(courseId, holeNum, note) {
  if (!courseNoteOverrides[courseId]) courseNoteOverrides[courseId] = {};
  courseNoteOverrides[courseId][holeNum] = note;
  await storageSet(STORAGE_KEY_COURSE_NOTES, JSON.stringify(courseNoteOverrides));
}

function getHoleStrategy(courseId, holeNum) {
  // User edits override library
  if (courseNoteOverrides[courseId] && courseNoteOverrides[courseId][holeNum] !== undefined) {
    return courseNoteOverrides[courseId][holeNum];
  }
  const course = COURSE_LIBRARY[courseId];
  if (!course) return null;
  const hole = course.holes.find(h => h.num === holeNum);
  return hole ? hole.strategy : null;
}

// ============================================================
// DEMO MODE — generates realistic data for testing the app
// ============================================================

function generateDemoData() {
  const courses = [
    { name: 'Bear\'s Best Las Vegas', cr: 73.8, slope: 137, tees: 'Championship' },
    { name: 'TPC Summerlin', cr: 73.4, slope: 135, tees: 'Blue' },
    { name: 'Shadow Creek', cr: 75.2, slope: 142, tees: 'Tournament' },
    { name: 'Reflection Bay', cr: 72.6, slope: 132, tees: 'Blue' },
    { name: 'Cascata', cr: 74.1, slope: 138, tees: 'Championship' },
    { name: 'Wynn Golf Club', cr: 72.8, slope: 131, tees: 'White' },
    { name: 'Paiute Sun Mountain', cr: 71.9, slope: 128, tees: 'Blue' },
    { name: 'Rio Secco', cr: 73.5, slope: 136, tees: 'Championship' }
  ];

  const courseNotes = ['Wind on back 9', 'Rained briefly', 'Tournament round', 'Practice round', 'Fast greens', 'New irons', '', '', '', ''];

  // McKenzie's underlying pattern (so the Coach tab finds real insights):
  // - Tends to miss approach shots SHORT and slightly LEFT
  // - Putts come up SHORT more than long (cautious putter)
  // - Tee shots reasonable but slight right miss tendency
  // - Decent scrambling but inconsistent

  function rollMiss(weights) {
    const total = weights.reduce((s, w) => s + w[1], 0);
    let r = Math.random() * total;
    for (const [val, w] of weights) {
      r -= w;
      if (r <= 0) return val;
    }
    return weights[0][0];
  }

  function generateRound(daysAgo, course, scoreBias) {
    // scoreBias: lower = better day, higher = worse day, 0 = average
    const date = new Date();
    date.setDate(date.getDate() - daysAgo);

    const round = {
      id: 'r_demo_' + (Date.now() - daysAgo * 86400000) + '_' + Math.floor(Math.random() * 1000),
      course: course.name,
      tees: course.tees,
      courseRating: course.cr,
      slope: course.slope,
      date: date.toISOString(),
      completed: true,
      dateCompleted: date.toISOString(),
      finalNotes: courseNotes[Math.floor(Math.random() * courseNotes.length)],
      holes: []
    };

    // 18 holes — typical par 72 layout
    const pars = [4,5,4,3,4,4,5,3,4,4,4,5,3,4,4,4,3,5];

    pars.forEach((par, i) => {
      const hole = {
        hole: i + 1,
        par: par,
        score: par,
        tee: null,
        approach: null,
        chip: null,
        putts: 2,
        puttMisses: [],
        puttDetails: [],
        firstPuttDistance: null,
        penalties: 0,
        notes: ''
      };

      // TEE SHOT (par 4 and 5 only)
      if (par >= 4) {
        const teeRoll = Math.random() + scoreBias * 0.1;
        if (teeRoll < 0.58) hole.tee = 'fairway';
        else if (teeRoll < 0.70) hole.tee = 'right';
        else if (teeRoll < 0.80) hole.tee = 'left';
        else if (teeRoll < 0.86) hole.tee = 'wayRight';
        else if (teeRoll < 0.92) hole.tee = 'wayLeft';
        else { hole.tee = 'penalty'; hole.penalties = 1; }
        if (hole.tee && hole.tee !== 'fairway' && hole.tee !== 'penalty' && Math.random() < 0.2) {
          hole.teeBunker = true;
        }
      }

      // SECOND SHOT (par 5 only) — depends on tee shot quality
      let secondShotReachedGreen = false;
      if (par === 5) {
        const fromFairway = hole.tee === 'fairway';
        const secondRoll = Math.random() + scoreBias * 0.1;
        // From fairway: 15% reach green in 2, 65% lay up to fairway, rest miss
        // From rough: 5% reach green, 55% recover to fairway, rest miss
        const greenChance = fromFairway ? 0.15 : 0.05;
        const fairwayChance = fromFairway ? 0.80 : 0.60;

        if (secondRoll < greenChance) {
          hole.secondShot = 'green';
          secondShotReachedGreen = true;
          hole.approach = 'gir'; // Reaching green in 2 = GIR
        } else if (secondRoll < fairwayChance) {
          hole.secondShot = 'fairway';
        } else if (secondRoll < fairwayChance + 0.06) hole.secondShot = 'short';
        else if (secondRoll < fairwayChance + 0.12) hole.secondShot = 'right';
        else if (secondRoll < fairwayChance + 0.16) hole.secondShot = 'left';
        else if (secondRoll < fairwayChance + 0.19) hole.secondShot = 'chunked';
        else hole.secondShot = 'thinned';
      }

      // APPROACH — par 3 and 4, OR par 5 not reached in 2
      let gir = false;
      if (!secondShotReachedGreen) {
        const approachRoll = Math.random() + scoreBias * 0.15;
        if (approachRoll < 0.48) { hole.approach = 'gir'; gir = true; }
        else if (approachRoll < 0.70) hole.approach = 'short';
        else if (approachRoll < 0.80) hole.approach = 'left';
        else if (approachRoll < 0.86) hole.approach = 'right';
        else if (approachRoll < 0.90) hole.approach = 'long';
        else if (approachRoll < 0.95) hole.approach = 'chunked';
        else hole.approach = 'thinned';
        if (!gir && hole.approach !== 'chunked' && hole.approach !== 'thinned') {
          const bunkerChance = hole.approach === 'short' ? 0.30 : 0.22;
          if (Math.random() < bunkerChance) hole.approachBunker = true;
        }
      } else {
        gir = true;
      }

      // CHIP — if missed green
      if (!gir) {
        const chipRoll = Math.random() + scoreBias * 0.1;
        if (chipRoll < 0.06) hole.chip = 'holed';
        else if (chipRoll < 0.40) hole.chip = 'good';     // 6 ft
        else if (chipRoll < 0.70) hole.chip = 'okay';     // 6-15 ft
        else if (chipRoll < 0.88) hole.chip = 'poor';
        else hole.chip = 'mishit';
      }

      // PUTTS — short bias for first putt distance
      let firstPuttDist = gir ? 'mid' : (hole.chip === 'good' ? 'short' : hole.chip === 'holed' ? 'in' : 'long');
      let putts = 2;
      const puttMisses = [];

      if (firstPuttDist === 'in') {
        putts = 0;
      } else if (firstPuttDist === 'short') {
        // 6 ft putt
        const r = Math.random();
        if (r < 0.55) putts = 1;
        else { putts = 2; puttMisses.push(rollMiss([['right', 0.3], ['left', 0.3], ['short', 0.4]])); }
      } else if (firstPuttDist === 'mid') {
        // 20 ft putt
        const r = Math.random();
        if (r < 0.12) putts = 1;
        else if (r < 0.78) { putts = 2; puttMisses.push(rollMiss([['short', 0.45], ['right', 0.25], ['left', 0.20], ['lipped', 0.10]])); }
        else { putts = 3; puttMisses.push('short'); puttMisses.push(rollMiss([['right', 0.5], ['left', 0.5]])); }
      } else {
        // long putt
        const r = Math.random();
        if (r < 0.04) putts = 1;
        else if (r < 0.65) { putts = 2; puttMisses.push(rollMiss([['short', 0.5], ['long', 0.2], ['right', 0.15], ['left', 0.15]])); }
        else { putts = 3; puttMisses.push('short'); puttMisses.push(rollMiss([['short', 0.3], ['right', 0.35], ['left', 0.35]])); }
      }

      hole.putts = putts;
      hole.puttMisses = puttMisses;

      // SCORE — back into it from the data
      // base = par + offsets
      let score = par;
      if (!gir) {
        if (hole.chip === 'holed') {
          score = par;  // chip-in saves par on bogey path
        } else if (hole.chip === 'good' && putts === 1) {
          score = par;  // up & down
        } else if (hole.chip === 'good') {
          score = par + 1;
        } else if (hole.chip === 'okay') {
          score = par + 1 + (putts > 2 ? 1 : 0);
        } else if (hole.chip === 'poor') {
          score = par + 1 + (putts >= 2 ? 1 : 0);
        } else if (hole.chip === 'mishit') {
          score = par + 2;
        } else {
          score = par + putts - 1;
        }
      } else {
        // GIR: score = par - 1 (birdie if 1 putt), par (2 putts), par + 1 (3 putts)
        if (putts === 0) score = par - 2;  // eagle (rare)
        else if (putts === 1) score = par - 1;
        else if (putts === 2) score = par;
        else score = par + 1;
      }

      score += hole.penalties;

      // Add occasional notes
      if (Math.random() < 0.15) {
        const tags = ['wind', 'bad lie', 'good swing', 'nerves', 'lost focus', 'pressure', 'bad bounce'];
        hole.notes = tags[Math.floor(Math.random() * tags.length)];
      }

      hole.score = Math.max(1, Math.min(12, score));
      hole.scoreOverride = true;  // demo data uses pre-computed scores
      round.holes.push(hole);
    });

    return round;
  }

  // Generate 12 rounds over the last ~60 days, with a slight improvement trend
  const rounds = [];
  const dayOffsets = [55, 50, 44, 38, 33, 27, 22, 17, 12, 8, 5, 2];

  dayOffsets.forEach((daysAgo, i) => {
    const course = courses[i % courses.length];
    // scoreBias: starts higher (worse), trends lower (better) over time
    const trendBias = -((i / 11) * 0.4) + (Math.random() - 0.5) * 0.6;
    rounds.push(generateRound(daysAgo, course, trendBias));
  });

  return rounds;
}

async function loadDemoData() {
  const demoRounds = generateDemoData();
  history = demoRounds;
  await saveHistory();
  // Mark as backed up to avoid the nag during demo

  };

function sendToBobby() {
  const completed = history.filter(r => r.completed);
  if (!completed.length) {
    showToast('No rounds to send yet');
    return;
  }

  const stats = aggregateStats(history);
  const hcp = calculateHandicapIndex(history);
  const hcpDisplay = hcp !== null ? (hcp < 0 ? '+' + Math.abs(hcp).toFixed(1) : hcp.toFixed(1)) : 'Not yet';
  const insights = generateInsights(history);

  const summary = [];
  summary.push('========================================');
  summary.push('RANGE DATA EXPORT — McKenzie Lane');
  summary.push('For Bobby · ' + new Date().toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' }));
  summary.push('========================================');
  summary.push('');
  summary.push('SUMMARY');
  summary.push('  Rounds played: ' + completed.length);
  summary.push('  Handicap Index: ' + hcpDisplay);
  summary.push('  Scoring average: ' + stats.avgScore + ' (' + (stats.avgVsPar >= 0 ? '+' : '') + stats.avgVsPar + ' vs par)');
  summary.push('  Best round: ' + stats.bestScore);
  summary.push('  Fairways hit: ' + stats.fairwayPct + '%');
  summary.push('  GIR: ' + stats.girPct + '%');
  summary.push('  Putts per round: ' + stats.avgPutts);
  summary.push('  Scrambling: ' + stats.scramblePct + '%');
  summary.push('  Penalties per round: ' + stats.avgPenalties);
  if (stats.driveRoundsLogged > 0) {
    summary.push('');
    summary.push('DRIVING DISTANCE GAP TO PEERS');
    summary.push('  Logged across: ' + stats.driveRoundsLogged + ' rounds');
    summary.push('  Average gap: ' + (stats.avgDriveDelta > 0 ? '+' : '') + stats.avgDriveDelta + ' yards vs peers');
    if (stats.avgDriveYds) summary.push('  Average drive (when known): ' + stats.avgDriveYds + ' yards');
    summary.push('  Recent gaps: ' + stats.driveDeltas.slice(-5).map(d => (d.delta > 0 ? '+' : '') + d.delta).join(', ') + ' yds');
  }
  summary.push('');

  if (insights && insights.ready && insights.insights.length) {
    summary.push('TOP PATTERNS IN HER GAME (from Coach tab)');
    insights.insights.forEach((ins, i) => {
      summary.push('  ' + (i+1) + '. [' + ins.area + '] ' + ins.title);
      summary.push('     ' + ins.finding);
    });
    summary.push('');
  }

  summary.push('LAST 5 ROUNDS');
  completed.slice(-5).forEach(r => {
    const d = new Date(r.date).toLocaleDateString('en-US', { month:'short', day:'numeric' });
    const score = totalScore(r);
    const par = totalPar(r);
    const diff = score - par;
    const diffText = diff === 0 ? 'E' : diff > 0 ? '+'+diff : ''+diff;
    summary.push('  ' + d + ' · ' + (r.course || 'Unnamed') + ' · ' + score + ' (' + diffText + ')');
  });
  summary.push('');

  const messageField = document.getElementById('send-to-bobby-msg');
  const userMessage = messageField ? messageField.value.trim() : '';
  if (userMessage) {
    summary.push('MESSAGE FROM McKENZIE');
    summary.push('  ' + userMessage);
    summary.push('');
  }

  summary.push('========================================');
  summary.push('FULL JSON DATA BELOW — paste to Claude');
  summary.push('========================================');
  summary.push('');
  summary.push(JSON.stringify({
    player: 'McKenzie',
    sentAt: new Date().toISOString(),
    handicapIndex: hcp,
    summaryStats: stats,
    rounds: history,
    message: userMessage || null
  }, null, 2));

  const bundle = summary.join('\n');
  const filename = 'mckenzie-for-dad-' + new Date().toISOString().split('T')[0] + '.txt';
  shareOrCopy(bundle, filename, 'text/plain');

  // Clear the message field after sending
  if (messageField) messageField.value = '';

  markBackedUp().then(() => {
    if (document.querySelector('.tab[data-view="stats"]').classList.contains('active')) renderStats();
  });
}

function exportCSV() {
  const headers = ['date','course','tees','courseRating','slope','differential','hole','par','score','scoreOverride','tee','teeBunker','secondShot','secondBunker','approach','approachBunker','recoveries','putts','firstPuttDistance','puttDetails','puttMisses','penalties','notes'];
  const rows = [headers.join(',')];
  history.filter(r => r.completed).forEach(r => {
    const dateStr = new Date(r.date).toISOString().split('T')[0];
    const diff = scoreDifferential(r).toFixed(1);
    r.holes.forEach(h => {
      const recoveriesStr = (h.recoveries || []).map(rc => `${rc.bunker ? 'bunker' : 'chip'}:${rc.result || ''}`).join('|');
      rows.push([
        dateStr,
        csvEsc(r.course || ''),
        csvEsc(r.tees || ''),
        r.courseRating || 72.0,
        r.slope || 113,
        diff,
        h.hole, h.par, holeScore(h),
        h.scoreOverride ? 'yes' : '',
        h.tee || '',
        h.teeBunker ? 'yes' : '',
        h.secondShot || '',
        h.secondBunker ? 'yes' : '',
        h.approach || '',
        h.approachBunker ? 'yes' : '',
        csvEsc(recoveriesStr),
        h.putts !== undefined && h.putts !== null ? h.putts : '',
        h.firstPuttDistance || '',
        csvEsc((h.puttDetails || []).filter(d => d).map(d => d.type).join('|')),
        csvEsc((h.puttMisses || []).join('|')),
        h.penalties || 0,
        csvEsc(h.notes || '')
      ].join(','));
    });
  });
  shareOrCopy(rows.join('\n'), 'range-export.csv', 'text/csv');
  markBackedUp().then(() => {
    if (document.querySelector('.tab[data-view="stats"]').classList.contains('active')) renderStats();
    if (document.querySelector('.tab[data-view="play"]').classList.contains('active')) renderPlay();
  });
}

function triggerImport() {
  // Build hidden file input
  let inp = document.getElementById('import-file-input');
  if (!inp) {
    inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'application/json,.json';
    inp.id = 'import-file-input';
    inp.style.display = 'none';
    inp.addEventListener('change', handleImport);
    document.body.appendChild(inp);
  }
  inp.value = '';
  inp.click();
}

async function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data.rounds || !Array.isArray(data.rounds)) {
      showToast('That doesn\'t look like a Range backup');
      return;
    }
    const incoming = data.rounds.filter(r => r && r.id && r.holes);
    if (!incoming.length) {
      showToast('No valid rounds found');
      return;
    }
    showModal({
      title: 'Import rounds?',
      text: `Found ${incoming.length} round${incoming.length === 1 ? '' : 's'} in this backup. Choose how to handle them:`,
      confirmText: 'Merge',
      onConfirm: async () => {
        // Merge: keep current + add any new ones (by id)
        const existingIds = new Set(history.map(r => r.id));
        const newOnes = incoming.filter(r => !existingIds.has(r.id));
        history = [...history, ...newOnes].sort((a, b) => new Date(a.date) - new Date(b.date));
        await saveHistory();
        hideModal();
        showToast(`Added ${newOnes.length} new round${newOnes.length === 1 ? '' : 's'}`);
        renderStats();
        renderRounds();
        renderCoach();
        renderPlay();
      }
    });
    // Add a "Replace all" option to the modal
    setTimeout(() => {
      const actions = document.getElementById('modal-actions');
      const replaceBtn = document.createElement('button');
      replaceBtn.className = 'modal-btn danger';
      replaceBtn.textContent = 'Replace all';
      replaceBtn.onclick = async () => {
        if (!confirm('This will delete all current rounds and replace with the backup. Continue?')) return;
        history = incoming.sort((a, b) => new Date(a.date) - new Date(b.date));
        await saveHistory();
        hideModal();
        showToast(`Replaced with ${incoming.length} round${incoming.length === 1 ? '' : 's'}`);
        renderStats();
        renderRounds();
        renderCoach();
        renderPlay();
      };
      actions.insertBefore(replaceBtn, actions.firstChild);
    }, 50);
  } catch(err) {
    showToast('Could not read that file');
    console.error(err);
  }
}

function csvEsc(s) {
  s = String(s);
  if (s.includes(',') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function shareOrCopy(data, filename, mime) {
  if (navigator.share) {
    try {
      const blob = new Blob([data], { type: mime });
      const file = new File([blob], filename, { type: mime });
      navigator.share({ files: [file], title: 'Range export' }).catch(() => copyText(data));
      return;
    } catch(e) {}
  }
  copyText(data);
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard'));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
