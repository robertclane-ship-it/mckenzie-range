<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Range">
<title>Range</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; user-select:none; }

  :root {
    --fairway:#1a3d2e;
    --fairway-deep:#0f2a1f;
    --fairway-light:#2a5240;
    --green:#4a7a5a;
    --green-light:#8fb88f;
    --sand:#e8dcc4;
    --sand-deep:#d4c5a3;
    --paper:#fafaf7;
    --ink:#0a1410;
    --ink-soft:#2a3530;
    --ink-faint:#6a7570;
    --flag:#f5c842;
    --flag-deep:#d4a832;
    --red:#c4452e;
    --red-light:#e87a65;
    --rule:rgba(0,0,0,0.08);
    --shadow:0 2px 12px rgba(10,20,16,0.06);
  }

  html, body { height:100%; overflow:hidden; overscroll-behavior:none; background:var(--paper); }
  body { font-family:'Bricolage Grotesque',-apple-system,sans-serif; color:var(--ink); line-height:1.4; font-feature-settings:'ss01','ss02'; }

  .app { display:flex; flex-direction:column; height:100vh; height:100dvh; max-width:480px; margin:0 auto; background:var(--paper); position:relative; }

  /* TOPBAR */
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; background:var(--fairway); color:var(--paper); padding-top:calc(16px + env(safe-area-inset-top)); }
  .topbar-brand { font-weight:800; font-size:22px; letter-spacing:-0.02em; }
  .topbar-brand span { color:var(--flag); }
  .topbar-meta { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.05em; text-transform:uppercase; opacity:0.7; }

  /* TABS */
  .tabs { display:flex; background:var(--fairway); padding:0 8px 0; gap:2px; }
  .tab { flex:1; background:none; border:none; color:rgba(255,255,255,0.5); font-family:'Bricolage Grotesque',sans-serif; font-weight:600; font-size:12px; padding:14px 4px; cursor:pointer; letter-spacing:0.02em; text-transform:uppercase; border-radius:8px 8px 0 0; transition:all 0.15s; }
  .tab.active { color:var(--ink); background:var(--paper); }

  main { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; background:var(--paper); }
  .view { display:none; padding:20px; padding-bottom:60px; min-height:100%; }
  .view.active { display:block; animation:viewIn 0.25s ease-out; }
  @keyframes viewIn { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  /* ROUND HEADER */
  .round-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--rule); }
  .round-course-input { flex:1; border:none; background:none; font-weight:700; font-size:18px; color:var(--ink); padding:4px 0; outline:none; width:100%; }
  .round-course-input::placeholder { color:var(--ink-faint); font-style:italic; font-weight:500; }
  .round-totals { display:flex; gap:12px; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.05em; }
  .round-totals span { color:var(--ink); font-weight:700; font-size:14px; }

  /* HOLE NAV */
  .hole-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px; }
  .hole-nav-btn { width:44px; height:44px; border-radius:50%; background:var(--sand); border:none; font-size:20px; font-weight:700; color:var(--fairway); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform 0.1s; }
  .hole-nav-btn:active { transform:scale(0.92); background:var(--sand-deep); }
  .hole-nav-btn:disabled { opacity:0.3; cursor:not-allowed; }
  .hole-display { flex:1; text-align:center; }
  .hole-number { font-weight:800; font-size:56px; line-height:1; color:var(--fairway); letter-spacing:-0.04em; }
  .hole-par { display:flex; justify-content:center; align-items:center; gap:8px; margin-top:6px; font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--ink-faint); }
  .par-selector { display:inline-flex; gap:4px; }
  .par-btn { width:28px; height:28px; border-radius:14px; border:1px solid var(--rule); background:var(--paper); font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; color:var(--ink); cursor:pointer; }
  .par-btn.active { background:var(--fairway); color:var(--paper); border-color:var(--fairway); }

  /* ENTRY BLOCK */
  .entry-block { margin-bottom:14px; background:var(--paper); border:1px solid var(--rule); border-radius:14px; padding:14px; }
  .entry-block.compact { padding:12px 14px; }
  .entry-label { font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-faint); font-weight:700; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
  .entry-label-tag { color:var(--ink); font-weight:700; font-size:12px; text-transform:none; letter-spacing:0; }
  .entry-label-tag.good { color:var(--green); }
  .entry-label-tag.bad { color:var(--red); }

  .btn-group { display:grid; gap:6px; }
  .btn-group.cols-2 { grid-template-columns:1fr 1fr; }
  .btn-group.cols-3 { grid-template-columns:1fr 1fr 1fr; }
  .btn-group.cols-4 { grid-template-columns:1fr 1fr 1fr 1fr; }
  .btn-group.cols-5 { grid-template-columns:repeat(5,1fr); }

  .data-btn { background:var(--paper); border:1.5px solid var(--rule); padding:11px 4px; border-radius:10px; font-family:'Bricolage Grotesque',sans-serif; font-weight:600; font-size:12.5px; color:var(--ink-soft); cursor:pointer; transition:all 0.12s; min-height:44px; display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.15; }
  .data-btn:active { transform:scale(0.96); }
  .data-btn.active { background:var(--fairway); color:var(--paper); border-color:var(--fairway); }
  .data-btn.active.good { background:var(--green); border-color:var(--green); }
  .data-btn.active.bad { background:var(--red); border-color:var(--red); color:var(--paper); }
  .data-btn.active.warn { background:var(--flag-deep); border-color:var(--flag-deep); color:var(--fairway-deep); }

  /* PRACTICE LINK BTN */
  .practice-link-btn {
    background:var(--sand);
    border:none;
    padding:10px 16px;
    border-radius:8px;
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--fairway);
    cursor:pointer;
    margin:4px 4px 0;
    letter-spacing:0;
    text-transform:none;
  }
  .practice-link-btn:active { background:var(--sand-deep); }

  /* PRACTICE MODE HOLES */
  .practice-hole {
    padding:14px;
    margin-bottom:10px;
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:10px;
  }
  .practice-hole-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:10px; }
  .practice-hole-num { display:flex; align-items:baseline; gap:8px; }
  .practice-hole-big { font-weight:800; font-size:24px; color:var(--fairway); letter-spacing:-0.03em; line-height:1; }
  .practice-hole-par { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.08em; }
  .practice-hole-meta { display:flex; gap:8px; align-items:center; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint); }
  .practice-hole-hcp { color:var(--flag-deep); font-weight:700; }
  .practice-edited { background:var(--flag); color:var(--fairway-deep); padding:2px 6px; border-radius:3px; font-weight:700; }
  .practice-hole-strategy { font-size:13.5px; color:var(--ink-soft); line-height:1.55; -webkit-user-select:text; user-select:text; }

  /* COURSE PICKER */
  .course-picker { display:flex; flex-direction:column; gap:8px; max-width:340px; margin:0 auto; }
  .course-pick-btn {
    background:var(--paper);
    border:1.5px solid var(--rule);
    border-radius:14px;
    padding:14px 18px;
    text-align:left;
    cursor:pointer;
    font-family:'Bricolage Grotesque',sans-serif;
    transition:all 0.15s;
    box-shadow:var(--shadow);
  }
  .course-pick-btn:active { transform:scale(0.98); background:var(--sand); }
  .course-pick-btn:hover { border-color:var(--fairway); }
  .course-pick-btn.other { background:transparent; border-style:dashed; box-shadow:none; }
  .course-pick-name { font-weight:700; font-size:16px; color:var(--fairway); margin-bottom:2px; letter-spacing:-0.01em; }
  .course-pick-detail { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint); letter-spacing:0.04em; text-transform:uppercase; }
  .course-pick-btn.other .course-pick-name { color:var(--ink-soft); }

  /* STRATEGY CARD */
  .strategy-card {
    background:linear-gradient(135deg, rgba(245,200,66,0.08) 0%, rgba(212,168,50,0.04) 100%);
    border:1px solid rgba(212,168,50,0.3);
    border-radius:12px;
    padding:0;
    margin-bottom:14px;
    overflow:hidden;
  }
  .strategy-card summary {
    list-style:none;
    cursor:pointer;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .strategy-card summary::-webkit-details-marker { display:none; }
  .strategy-summary-left { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .strategy-tag {
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.15em;
    color:var(--flag-deep);
    font-weight:700;
    background:rgba(212,168,50,0.15);
    padding:3px 8px;
    border-radius:4px;
  }
  .strategy-yards { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint); letter-spacing:0.05em; }
  .strategy-chevron { color:var(--flag-deep); font-size:14px; transition:transform 0.2s; }
  .strategy-card[open] .strategy-chevron { transform:rotate(180deg); }
  .strategy-body { padding:0 16px 14px; }
  .strategy-text { font-size:14px; color:var(--ink-soft); line-height:1.55; margin-bottom:12px; padding-top:6px; border-top:1px solid rgba(212,168,50,0.25); padding-top:12px; -webkit-user-select:text; user-select:text; }
  .strategy-edit-btn {
    background:transparent;
    border:1px solid var(--flag-deep);
    color:var(--fairway);
    padding:8px 14px;
    border-radius:8px;
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    cursor:pointer;
  }
  .strategy-edit-btn:active { background:var(--flag); }

  /* RUNNING TOTAL BANNER */
  .running-total {
    background:var(--fairway);
    color:var(--paper);
    border-radius:14px;
    padding:16px 20px;
    margin-bottom:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
  }
  .running-total.under { background:linear-gradient(135deg, #8a4527 0%, #a85a35 100%); }
  .running-total.over { background:linear-gradient(135deg, var(--fairway) 0%, var(--fairway-light) 100%); }
  .running-total.even { background:linear-gradient(135deg, var(--fairway) 0%, var(--fairway-light) 100%); }
  .running-total-main { display:flex; align-items:baseline; gap:12px; flex:1; }
  .running-total-score { font-weight:800; font-size:42px; letter-spacing:-0.04em; line-height:1; color:var(--paper); }
  .running-total-diff { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:18px; color:var(--flag); letter-spacing:0.02em; }
  .running-total-thru { font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:rgba(255,255,255,0.6); font-weight:600; text-align:right; }

  /* SCORE BLOCK — refactored */
  .score-block { background:var(--paper); color:var(--ink); padding:14px 18px; border-radius:14px; margin-bottom:14px; border:1px solid var(--rule); box-shadow:var(--shadow); }
  .score-block-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .score-block-left { flex:1; }
  .score-block-left .entry-label { color:var(--ink-faint); margin-bottom:6px; }
  .score-number-row { display:flex; align-items:baseline; gap:14px; }
  .score-number { font-weight:800; font-size:54px; line-height:1; letter-spacing:-0.04em; color:var(--fairway); min-width:auto; }
  .score-vs-par-inline { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.1em; color:var(--flag-deep); text-transform:uppercase; font-weight:700; }
  .score-edit-btn { background:var(--sand); border:none; padding:8px 14px; border-radius:8px; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px; color:var(--fairway); cursor:pointer; text-transform:uppercase; letter-spacing:0.08em; }
  .score-edit-btn.active { background:var(--fairway); color:var(--paper); }
  .score-edit-btn:active { transform:scale(0.96); }
  .score-override-row { display:flex; align-items:center; justify-content:center; gap:20px; margin-top:14px; padding-top:14px; border-top:1px dashed var(--rule); }
  .score-btn-big { width:48px; height:48px; border-radius:24px; background:var(--sand); border:none; color:var(--fairway); font-size:24px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .score-btn-big:active { transform:scale(0.92); background:var(--sand-deep); }
  .score-override-num { font-weight:800; font-size:44px; line-height:1; letter-spacing:-0.04em; color:var(--fairway); min-width:60px; text-align:center; }

  /* RECOVERY SHOTS */
  .recovery-item { background:rgba(232,220,196,0.3); border-radius:10px; padding:12px; margin-bottom:8px; }
  .recovery-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .recovery-label { font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--ink-soft); font-weight:700; }
  .recovery-remove { background:none; border:none; color:var(--red); font-size:22px; line-height:1; cursor:pointer; padding:0 6px; font-weight:300; }
  .recovery-remove:active { color:#8a2818; }
  .add-recovery-btn { width:100%; background:var(--sand); border:1.5px dashed var(--fairway); border-radius:10px; padding:12px; font-family:'Bricolage Grotesque',sans-serif; font-weight:600; font-size:13px; color:var(--fairway); cursor:pointer; text-transform:none; letter-spacing:0; margin-top:6px; }
  .add-recovery-btn:active { background:var(--sand-deep); transform:scale(0.99); }

  /* PUTT DETAIL */
  .putt-detail { margin-top:10px; padding-top:10px; border-top:1px dashed var(--rule); }
  .putt-misses { display:flex; gap:6px; flex-wrap:wrap; }
  .putt-miss-btn { background:var(--paper); border:1.5px solid var(--rule); padding:8px 12px; border-radius:20px; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px; color:var(--ink-soft); cursor:pointer; text-transform:uppercase; letter-spacing:0.05em; }
  .putt-miss-btn.active { background:var(--red); color:var(--paper); border-color:var(--red); }

  /* NOTES */
  .notes-input { width:100%; background:var(--paper); border:1.5px solid var(--rule); border-radius:10px; padding:10px 12px; font-family:'Bricolage Grotesque',sans-serif; font-size:14px; color:var(--ink); resize:none; min-height:48px; outline:none; -webkit-user-select:text; user-select:text; }
  .notes-input:focus { border-color:var(--fairway); }
  .quick-tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .quick-tag { background:var(--sand); border:none; padding:5px 10px; border-radius:14px; font-size:11px; font-weight:600; color:var(--fairway); cursor:pointer; font-family:'JetBrains Mono',monospace; letter-spacing:0.04em; text-transform:uppercase; }
  .quick-tag:active { background:var(--sand-deep); }

  /* FINISH */
  .finish-btn { width:100%; background:var(--flag); border:none; padding:18px; border-radius:14px; font-weight:700; font-size:16px; color:var(--fairway-deep); cursor:pointer; text-transform:uppercase; letter-spacing:0.08em; margin-top:8px; }
  .finish-btn:active { transform:scale(0.98); }

  /* COLLAPSIBLE */
  .collapsible-header { display:flex; justify-content:space-between; align-items:center; cursor:pointer; padding:4px 0; }
  .collapsible-toggle { width:24px; height:24px; border-radius:12px; background:var(--sand); display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--fairway); font-weight:700; transition:transform 0.2s; }
  .collapsible.expanded .collapsible-toggle { transform:rotate(180deg); }
  .collapsible-body { display:none; padding-top:12px; }
  .collapsible.expanded .collapsible-body { display:block; }

  /* COURSE META */
  .course-meta { background:var(--sand); border-radius:12px; padding:10px 14px; margin-bottom:16px; font-size:12px; }
  .course-meta summary { list-style:none; cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); letter-spacing:0.05em; font-weight:500; }
  .course-meta summary::-webkit-details-marker { display:none; }
  .course-meta-edit { color:var(--flag-deep); font-weight:700; text-transform:uppercase; letter-spacing:0.1em; font-size:10px; }
  .course-meta-body { margin-top:12px; padding-top:10px; border-top:1px solid rgba(0,0,0,0.08); }
  .course-meta-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .course-meta-row label { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.08em; font-weight:700; flex-shrink:0; width:90px; }
  .course-meta-row input { flex:1; border:1px solid var(--rule); border-radius:6px; padding:8px 10px; font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink); background:var(--paper); outline:none; -webkit-user-select:text; user-select:text; }
  .course-meta-row input:focus { border-color:var(--fairway); }
  .course-meta-hint { font-size:11px; color:var(--ink-faint); margin-top:8px; font-style:italic; line-height:1.4; }

  /* HANDICAP CARD */
  .handicap-card { background:linear-gradient(135deg, var(--fairway) 0%, var(--fairway-light) 100%); color:var(--paper); padding:24px; border-radius:18px; margin-bottom:20px; position:relative; overflow:hidden; }
  .handicap-card::before { content:''; position:absolute; top:-40px; right:-40px; width:140px; height:140px; border-radius:50%; background:rgba(245,200,66,0.1); }
  .handicap-label { font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.15em; color:rgba(255,255,255,0.6); font-weight:700; margin-bottom:10px; position:relative; }
  .handicap-value { font-weight:800; font-size:64px; line-height:1; color:var(--flag); letter-spacing:-0.04em; position:relative; }
  .handicap-value-pending { font-weight:600; font-size:20px; color:rgba(255,255,255,0.7); position:relative; line-height:1.3; }
  .handicap-detail { font-family:'JetBrains Mono',monospace; font-size:11px; color:rgba(255,255,255,0.65); margin-top:8px; letter-spacing:0.04em; position:relative; }
  .handicap-meta { display:flex; justify-content:space-between; align-items:baseline; margin-top:14px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.15); position:relative; }
  .handicap-meta-item { text-align:center; flex:1; }
  .handicap-meta-label { font-family:'JetBrains Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:0.12em; color:rgba(255,255,255,0.5); font-weight:600; margin-bottom:4px; }
  .handicap-meta-value { font-weight:700; font-size:16px; color:var(--paper); }

  /* COACH VIEW */
  .coach-empty-icon { font-size:48px; margin-bottom:12px; }
  .coach-empty { text-align:center; padding:50px 30px; }
  .coach-empty-title { font-weight:800; font-size:22px; color:var(--fairway); margin-bottom:8px; letter-spacing:-0.02em; }
  .coach-empty-sub { font-size:14px; color:var(--ink-faint); line-height:1.55; max-width:280px; margin:0 auto; }

  .coach-intro { background:var(--fairway); color:var(--paper); padding:20px; border-radius:14px; margin-bottom:18px; }
  .coach-intro-label { font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.12em; color:var(--flag); font-weight:700; margin-bottom:8px; }
  .coach-intro-text { font-size:15px; line-height:1.5; color:rgba(255,255,255,0.9); }
  .coach-intro-text strong { color:var(--paper); font-weight:700; }

  .insight { background:var(--paper); border:1px solid var(--rule); border-radius:14px; padding:18px; margin-bottom:14px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
  .insight-priority { position:absolute; top:0; left:0; height:100%; width:4px; background:var(--green); }
  .insight-priority.med { background:var(--flag-deep); }
  .insight-priority.high { background:var(--red); }

  .insight-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }

// STATE & STORAGE

const STORAGE_KEY_ACTIVE = 'range:active-round';
const STORAGE_KEY_HISTORY = 'range:rounds';
const STORAGE_KEY_BACKUP = 'range:last-backup';

let activeRound = null;
let currentHole = 1;
let history = [];
let lastBackup = null;  // { date, roundCount } or null

function newRound(courseId = null) {
  const course = courseId ? COURSE_LIBRARY[courseId] : null;
  const teeData = course ? course.tees[0] : null;
  const round = {
    id: 'r_' + Date.now(),
    course: course ? course.name : '',
    courseId: courseId,
    date: new Date().toISOString(),
    courseRating: teeData ? teeData.rating : 72.0,
    slope: teeData ? teeData.slope : 113,
    tees: teeData ? teeData.name : '',
    holes: Array.from({ length: 18 }, (_, i) => {
      const libHole = course ? course.holes.find(h => h.num === i + 1) : null;
      return {
        hole: i + 1,
        par: libHole ? libHole.par : 4,
        score: null,
        scoreOverride: false,
        tee: null,
        teeBunker: false,
        secondShot: null,
        secondBunker: false,
        approach: null,
        approachBunker: false,
        recoveries: [],
        chip: null,
        fromSand: false,
        putts: null,
        puttMisses: [],
        puttDetails: [],
        firstPuttDistance: null,
        driveDelta: null,        // per-hole: estimated yards behind (-) or ahead (+) of peers off the tee
        driveYds: null,          // optional: actual drive yardage
        peerDriveYds: null,      // optional: peers' drive yardage on this hole
        penalties: 0,
        notes: ''
      };
    }),
    finalNotes: '',
    completed: false,
    drivePartner: ''     // who she played with (round-level context for drive deltas)
  };
  return round;
}

// Storage backend detection.
// window.storage exists ONLY inside Claude's artifact preview. Real Safari, PWAs,
// and standalone deploys must use localStorage so the same bucket is used every time.
// To prevent the cross-context data invisibility bug we hit on May 30, we lock to
// localStorage on any host that isn't claude.ai/anthropic.com.
const STORAGE_BACKEND = (() => {
  try {
    const host = (typeof location !== 'undefined' && location.hostname) ? location.hostname : '';
    const inClaudePreview = host.endsWith('claude.ai') || host.endsWith('anthropic.com') || host.endsWith('claudeusercontent.com');
    if (inClaudePreview && typeof window !== 'undefined' && window.storage) return 'claude';
    return 'local';
  } catch(e) { return 'local'; }
})();

async function storageGet(key) {
  if (STORAGE_BACKEND === 'claude') {
    try {
      const r = await window.storage.get(key);
      return r ? r.value : null;
    } catch(e) { /* fall through */ }
  }
  try { return localStorage.getItem(key); } catch(e) { return null; }
}

async function storageSet(key, value) {
  if (STORAGE_BACKEND === 'claude') {
    try {
      await window.storage.set(key, value);
      return;
    } catch(e) { /* fall through */ }
  }
  try { localStorage.setItem(key, value); } catch(e) {}
}

async function storageDelete(key) {
  if (STORAGE_BACKEND === 'claude') {
    try {
      await window.storage.delete(key);
      return;
    } catch(e) { /* fall through */ }
  }
  try { localStorage.removeItem(key); } catch(e) {}
}

// ============================================================
// BACKUP TRACKING
// ============================================================

async function markBackedUp() {
  lastBackup = {
    date: new Date().toISOString(),
    roundCount: history.filter(r => r.completed).length
  };
  await storageSet(STORAGE_KEY_BACKUP, JSON.stringify(lastBackup));
}

function backupStatus() {
  const completedCount = history.filter(r => r.completed).length;
  if (completedCount === 0) return { state: 'none', text: '' };
  if (!lastBackup) {
    return {
      state: 'never',
      text: `Never backed up · ${completedCount} round${completedCount === 1 ? '' : 's'} at risk`,
      urgent: completedCount >= 3
    };
  }
  const daysSince = Math.floor((Date.now() - new Date(lastBackup.date).getTime()) / (1000 * 60 * 60 * 24));
  const newRounds = completedCount - lastBackup.roundCount;
  if (newRounds === 0 && daysSince < 30) {
    return { state: 'fresh', text: `Backed up ${daysSince === 0 ? 'today' : daysSince + ' day' + (daysSince === 1 ? '' : 's') + ' ago'} · all rounds saved` };
  }
  if (newRounds > 0) {
    return {
      state: 'stale',
      text: `${newRounds} new round${newRounds === 1 ? '' : 's'} since last backup`,
      urgent: newRounds >= 5 || daysSince >= 30
    };
  }
  return { state: 'old', text: `Last backup ${daysSince} days ago`, urgent: daysSince >= 30 };
}

async function loadState() {
  const a = await storageGet(STORAGE_KEY_ACTIVE);
  if (a) try { activeRound = JSON.parse(a); } catch(e) {}
  const h = await storageGet(STORAGE_KEY_HISTORY);
  if (h) try { history = JSON.parse(h); } catch(e) {}
  const b = await storageGet(STORAGE_KEY_BACKUP);
  if (b) try { lastBackup = JSON.parse(b); } catch(e) {}
}

let saveTimer = null;
function debouncedSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (activeRound) storageSet(STORAGE_KEY_ACTIVE, JSON.stringify(activeRound));
  }, 300);
}

async function saveHistory() {
  await storageSet(STORAGE_KEY_HISTORY, JSON.stringify(history));
}

// ============================================================
// CALCULATIONS
// ============================================================

// Compute a hole's score from logged shots if no manual override
function computeHoleScore(h) {
  if (h.scoreOverride && h.score !== null && h.score !== undefined) return h.score;

  let shots = 0;
  if (h.par === 3) {
    // Par 3: tee shot lands on or off the green
    if (h.approach !== null) shots += 1;
  } else if (h.par === 5) {
    // Par 5: tee + second + approach (if needed)
    if (h.tee !== null) shots += 1;
    if (h.secondShot !== null) shots += 1;
    // Approach only counts if second shot didn't reach the green
    if (h.secondShot !== 'green' && h.approach !== null) shots += 1;
  } else {
    // Par 4: tee + approach
    if (h.tee !== null) shots += 1;
    if (h.approach !== null) shots += 1;
  }

  if (h.recoveries && h.recoveries.length > 0) {
    shots += h.recoveries.length;
  } else if (h.chip !== null) {
    shots += 1;
  }

  if (h.putts !== null && h.putts !== undefined) shots += h.putts;
  shots += (h.penalties || 0);
  return shots;
}

function holeScore(h) {
  if (h.scoreOverride && h.score !== null && h.score !== undefined) return h.score;
  const computed = computeHoleScore(h);
  // For backwards compat: if computed is 0 and there's a legacy score, use it
  if (computed === 0 && h.score) return h.score;
  return computed;
}

function holeIsLogged(h) {
  return h.tee !== null || h.secondShot !== null || h.approach !== null || (h.recoveries && h.recoveries.length > 0) || h.chip !== null || (h.putts !== null && h.putts !== undefined) || h.scoreOverride;
}

function totalScore(r) { return r.holes.reduce((s,h) => s + (holeIsLogged(h) ? holeScore(h) : 0), 0); }
function totalPar(r) { return r.holes.reduce((s,h) => s + (holeIsLogged(h) ? (h.par||0) : 0), 0); }
function relativeToPar(r) {
  const d = totalScore(r) - totalPar(r);
  return d === 0 ? 'E' : d > 0 ? '+' + d : '' + d;
}
function holesPlayed(r) {
  return r.holes.filter(holeIsLogged).length;
}

function aggregateStats(rounds) {
  const completed = rounds.filter(r => r.completed);
  if (!completed.length) return null;

  let scoreSum = 0, parSum = 0;
  let fairwaysHit = 0, fairwaysAttempted = 0;
  let girs = 0, girAttempts = 0;
  let totalPutts = 0, holesForPutts = 0;
  let scrambleSuccess = 0, scrambleAttempts = 0;
  let penaltyTotal = 0;
  let teeMisses = { left: 0, right: 0, wayLeft: 0, wayRight: 0, penalty: 0 };
  let approachMisses = { short: 0, long: 0, left: 0, right: 0, chunked: 0, thinned: 0 };
  let puttMissCounts = { left: 0, right: 0, short: 0, long: 0, lipped: 0 };
  // Detailed putt tracking (new schema)
  let puttDetailCounts = { 'pace-long': 0, 'pace-short': 0, 'line-left': 0, 'line-right': 0, lipped: 0, mishit: 0 };
  let paceErrors = 0, lineErrors = 0;
  let overcorrections = 0; // long-then-short or short-then-long in same hole
  let firstPuttDistanceCounts = { short: 0, mid: 0, long: 0 };
  let fairwayBunkers = 0, greensideBunkers = 0;
  let sandSaveSuccess = 0, sandSaveAttempts = 0;
  // Driving distance gap tracking
  let driveDeltas = [];      // [{date, delta, partner}, ...]
  let avgDriveYdsArr = [];   // her own avg drive when logged

  completed.forEach(r => {
    scoreSum += totalScore(r);
    parSum += totalPar(r);
    // Drive delta tracking — per-hole now. Aggregate to round-level for display.
    const holeDeltasInRound = [];
    r.holes.forEach(h => {
      let d = null;
      if (h.driveDelta !== null && h.driveDelta !== undefined) {
        d = h.driveDelta;
      } else if (h.driveYds && h.peerDriveYds) {
        d = h.driveYds - h.peerDriveYds;
      }
      if (d !== null) holeDeltasInRound.push(d);
      if (h.driveYds) avgDriveYdsArr.push(h.driveYds);
    });
    if (holeDeltasInRound.length > 0) {
      const avgDelta = holeDeltasInRound.reduce((s,v)=>s+v,0) / holeDeltasInRound.length;
      driveDeltas.push({
        date: r.dateCompleted || r.date,
        delta: Math.round(avgDelta),
        holeCount: holeDeltasInRound.length,
        partner: r.drivePartner || ''
      });
    }
    r.holes.forEach(h => {
      // Tee shot — count for par 4 and 5
      if (h.par !== 3 && h.tee !== null) {
        fairwaysAttempted++;
        if (h.tee === 'fairway') fairwaysHit++;
        else if (teeMisses[h.tee] !== undefined) teeMisses[h.tee]++;
      }
      if (h.teeBunker) fairwayBunkers++;
      if (h.secondBunker) fairwayBunkers++;
      // Approach: on par 5, prefer the "green-in-2" signal as a GIR equivalent
      let effectiveApproach = h.approach;
      if (h.par === 5 && h.secondShot === 'green') effectiveApproach = 'gir';
      if (effectiveApproach !== null && effectiveApproach !== 'na') {
        girAttempts++;
        if (effectiveApproach === 'gir') girs++;
        else if (approachMisses[effectiveApproach] !== undefined) approachMisses[effectiveApproach]++;
      }
      if (h.approachBunker) {
        greensideBunkers++;
        // Sand save = bunker shot leads to either holed-out or onto green inside 6ft + 1-putt for par
        const firstRec = (h.recoveries && h.recoveries[0]) || null;
        const recOrChip = firstRec ? firstRec.result : h.chip;
        if (recOrChip) {
          sandSaveAttempts++;
          if (recOrChip === 'holed' || (recOrChip === 'good' && h.putts === 1)) sandSaveSuccess++;
        }
      }
      if (h.putts !== null && h.putts !== undefined) {
        totalPutts += h.putts;
        holesForPutts++;
      }
      // Scrambling = saving par from off the green
      // New schema: any recovery that lands close + 1-putt, OR holed-out recovery
      if (h.approach && h.approach !== 'gir' && h.approach !== 'na') {
        const firstRec = (h.recoveries && h.recoveries[0]) || null;
        const recResult = firstRec ? firstRec.result : h.chip;
        if (recResult) {
          scrambleAttempts++;
          const finalHoleScore = holeScore(h);
          // Save = scored par or better despite missing the green
          if (finalHoleScore <= h.par) scrambleSuccess++;
        }
      }
      penaltyTotal += (h.penalties || 0);
      (h.puttMisses || []).forEach(m => { if (puttMissCounts[m] !== undefined) puttMissCounts[m]++; });

      // New detailed putt tracking
      if (h.firstPuttDistance && firstPuttDistanceCounts[h.firstPuttDistance] !== undefined) {
        firstPuttDistanceCounts[h.firstPuttDistance]++;
      }
      const details = (h.puttDetails || []).filter(d => d);
      details.forEach(d => {
        if (puttDetailCounts[d.type] !== undefined) puttDetailCounts[d.type]++;
        if (d.type === 'pace-long' || d.type === 'pace-short') paceErrors++;
        if (d.type === 'line-left' || d.type === 'line-right') lineErrors++;
      });
      // Detect overcorrection within a hole (long then short, or short then long)
      if (details.length >= 2) {
        const types = details.map(d => d.type);
        if ((types[0] === 'pace-long' && types[1] === 'pace-short') ||
            (types[0] === 'pace-short' && types[1] === 'pace-long')) {
          overcorrections++;
        }
      }
    });
  });

  return {
    rounds: completed.length,
    avgScore: (scoreSum / completed.length).toFixed(1),
    avgVsPar: ((scoreSum - parSum) / completed.length).toFixed(1),
    fairwayPct: fairwaysAttempted ? Math.round(fairwaysHit / fairwaysAttempted * 100) : 0,
    girPct: girAttempts ? Math.round(girs / girAttempts * 100) : 0,
    avgPutts: holesForPutts ? (totalPutts / holesForPutts * 18).toFixed(1) : '0',
    scramblePct: scrambleAttempts ? Math.round(scrambleSuccess / scrambleAttempts * 100) : 0,
    avgPenalties: (penaltyTotal / completed.length).toFixed(1),
    bestScore: Math.min(...completed.map(totalScore)),
    teeMisses, approachMisses, puttMissCounts,
    puttDetailCounts, paceErrors, lineErrors, overcorrections,
    firstPuttDistanceCounts,
    girAttempts, fairwaysAttempted, totalPutts, holesForPutts,
    scrambleAttempts, scrambleSuccess,
    fairwayBunkers, greensideBunkers,
    sandSaveAttempts, sandSaveSuccess,
    sandSavePct: sandSaveAttempts ? Math.round(sandSaveSuccess / sandSaveAttempts * 100) : 0,
    bunkersPerRound: ((fairwayBunkers + greensideBunkers) / completed.length).toFixed(1),
    // Driving distance gap to peers
    driveDeltas,
    avgDriveYds: avgDriveYdsArr.length ? Math.round(avgDriveYdsArr.reduce((s,v)=>s+v,0) / avgDriveYdsArr.length) : null,
    avgDriveDelta: driveDeltas.length ? Math.round(driveDeltas.reduce((s,d)=>s+d.delta,0) / driveDeltas.length) : null,
    driveRoundsLogged: driveDeltas.length
  };
}

// ============================================================
// USGA HANDICAP CALCULATION
// ============================================================
// Score Differential = (113 / Slope) × (Adjusted Gross Score − Course Rating)
// Handicap Index = average of best N differentials × 0.96
// N depends on number of rounds:
//   3 → best 1, 4 → best 1 (−1), 5 → best 1, 6 → best 2 (−1), 7-8 → best 2,
//   9-11 → best 3, 12-14 → best 4, 15-16 → best 5, 17-18 → best 6, 19 → best 7, 20+ → best 8

function scoreDifferential(round) {
  const cr = round.courseRating || 72.0;
  const slope = round.slope || 113;
  const score = totalScore(round);
  // For now we use the gross score; net double-bogey adjustment would be ideal but adds complexity
  return (113 / slope) * (score - cr);
}

function calculateHandicapIndex(rounds) {
  const completed = rounds.filter(r => r.completed);
  if (completed.length < 3) return null;

  // Use most recent 20 rounds
  const recent = completed.slice(-20);
  const n = recent.length;

  // USGA "best N" table
  let bestN;
  if (n <= 3) bestN = 1;
  else if (n === 4) bestN = 1;
  else if (n === 5) bestN = 1;
  else if (n === 6) bestN = 2;
  else if (n <= 8) bestN = 2;
  else if (n <= 11) bestN = 3;
  else if (n <= 14) bestN = 4;
  else if (n <= 16) bestN = 5;
  else if (n <= 18) bestN = 6;
  else if (n === 19) bestN = 7;
  else bestN = 8;

  // Adjustment per USGA (applied to lower index for small sample sizes)
  let adjustment = 0;
  if (n === 3) adjustment = -2.0;
  else if (n === 4) adjustment = -1.0;
  else if (n === 6) adjustment = -1.0;

  const diffs = recent.map(scoreDifferential).sort((a, b) => a - b);
  const bestDiffs = diffs.slice(0, bestN);
  const avg = bestDiffs.reduce((s, d) => s + d, 0) / bestN;
  let index = avg + adjustment;
  // Cap at 54.0 per USGA; can be negative (+1, +2 etc.)
  return Math.round(index * 10) / 10;
}

function handicapTrend(rounds, windowSize = 5) {
  // Show the handicap index after each round, so we can plot a trend
  const completed = rounds.filter(r => r.completed);
  if (completed.length < 3) return [];
  const trend = [];
  for (let i = 3; i <= completed.length; i++) {
    const subset = completed.slice(0, i);
    const idx = calculateHandicapIndex(subset);
    if (idx !== null) trend.push({ roundNumber: i, index: idx });
  }
  return trend;
}

// ============================================================
// COACHING ANALYSIS — what is she actually doing wrong?
// ============================================================

function generateInsights(rounds) {
  const completed = rounds.filter(r => r.completed);
  const insights = [];

  if (completed.length < 3) {
    return { ready: false, roundsNeeded: 3 - completed.length, insights: [] };
  }

  const stats = aggregateStats(rounds);

  // Compute per-area strokes lost vs. baseline (D1 college: 74 avg, 65% fairway, 65% GIR, 30 putts, 55% scramble)
  // Each insight has: { area, severity (0-10), title, finding, prescription }

  // --- TEE ANALYSIS ---
  const teeMissTotal = Object.values(stats.teeMisses).reduce((s,v)=>s+v, 0);
  if (teeMissTotal >= 5) {
    const leftBias = stats.teeMisses.left + stats.teeMisses.wayLeft;
    const rightBias = stats.teeMisses.right + stats.teeMisses.wayRight;
    const total = leftBias + rightBias;
    if (total > 0) {
      const leftPct = Math.round(leftBias / total * 100);
      const rightPct = Math.round(rightBias / total * 100);
      // Bias is meaningful only if > 65% of misses to one side
      if (leftPct >= 65) {
        insights.push({
          area: 'TEE',
          severity: Math.min(10, leftBias),
          title: 'Your misses go left',
          finding: `${leftPct}% of tee misses (${leftBias} of ${total}) miss left. This is a real pattern, not random.`,
          prescription: 'Likely a closed clubface at impact or an over-the-top swing path. On the range: alignment sticks down the target line, focus on holding off the release. Get a video of your downswing from face-on — if your hands are ahead of the ball at impact, you\'re closing the face.'
        });
      } else if (rightPct >= 65) {
        insights.push({
          area: 'TEE',
          severity: Math.min(10, rightBias),
          title: 'Your misses go right',
          finding: `${rightPct}% of tee misses (${rightBias} of ${total}) miss right. This is a real pattern.`,
          prescription: 'Common causes: open face at impact, weak grip, or losing posture through impact. Try a stronger grip (rotate left hand right by 1/4 inch) for one practice session and see if the ball flight changes. If not, video your swing — early extension is the other usual culprit.'
        });
      }
    }
    // Catastrophic miss check
    if ((stats.teeMisses.wayLeft + stats.teeMisses.wayRight + stats.teeMisses.penalty) / teeMissTotal > 0.4) {
      insights.push({
        area: 'TEE',
        severity: 8,
        title: 'Too many "big" misses',
        finding: `${stats.teeMisses.wayLeft + stats.teeMisses.wayRight + stats.teeMisses.penalty} of ${teeMissTotal} tee misses were way offline or penalties. Big misses cost ~1.5 strokes each — they\'re the highest-leverage thing to fix.`,
        prescription: 'Trade distance for control off the tee on tight holes. Hit 3-wood or a long iron where penalty is in play. A 250-yard fairway is worth more than a 290-yard wayward drive.'
      });
    }
  }

  // --- APPROACH ANALYSIS ---
  const appMissTotal = Object.values(stats.approachMisses).reduce((s,v)=>s+v, 0);
  if (appMissTotal >= 6) {
    const shortMisses = stats.approachMisses.short;
    const longMisses = stats.approachMisses.long;
    const leftMisses = stats.approachMisses.left;
    const rightMisses = stats.approachMisses.right;
    const chunked = stats.approachMisses.chunked;
    const thinned = stats.approachMisses.thinned;

    // Short bias is very common and costly
    if (shortMisses / appMissTotal >= 0.35) {
      insights.push({
        area: 'APPROACH',
        severity: 9,
        title: 'You come up short too often',
        finding: `${shortMisses} of ${appMissTotal} approach misses (${Math.round(shortMisses/appMissTotal*100)}%) were short. This is the single most common amateur mistake and the easiest to fix.`,
        prescription: 'Most amateurs underclub on approach because they remember their best swing distance, not their average. For two weeks: take one more club than you think you need on every approach. Track if your GIR % goes up.'
      });
    }
    if ((leftMisses + rightMisses) / appMissTotal >= 0.5) {
      const direction = leftMisses > rightMisses ? 'left' : 'right';
      const directionalPct = Math.round((Math.max(leftMisses, rightMisses) / appMissTotal) * 100);
      insights.push({
        area: 'APPROACH',
        severity: 6,
        title: `Approaches drift ${direction}`,
        finding: `${directionalPct}% of approach misses drift ${direction}. Same direction as tee misses? That\'s a swing pattern. Opposite? Could be aim or alignment.`,
        prescription: `Alignment sticks on the range. Set up to the target with a stick on the ground at your feet, second stick pointing at target. Hit 20 mid-irons with this setup. Most ${direction} misses fix themselves with alignment alone.`
      });
    }
    if ((chunked + thinned) / appMissTotal >= 0.3) {
      insights.push({
        area: 'APPROACH',
        severity: 7,
        title: 'Strike inconsistency',
        finding: `${chunked + thinned} of ${appMissTotal} approach misses were chunked or thinned. This is a low-point control issue — bigger than direction.`,
        prescription: 'Towel drill: place a towel 6 inches behind the ball. Practice 50 wedge swings without hitting the towel. Re-trains low point forward of the ball. Do this for 2 weeks before worrying about direction.'
      });
    }
  }

  // --- PUTT ANALYSIS ---
  const puttMissTotal = Object.values(stats.puttMissCounts).reduce((s,v)=>s+v, 0);

  // NEW: pace vs line analysis from detailed tracking
  const detailedTotal = stats.paceErrors + stats.lineErrors;
  if (detailedTotal >= 5) {
    const pacePct = stats.paceErrors / detailedTotal;
    if (pacePct >= 0.65) {
      const longCount = stats.puttDetailCounts['pace-long'];
      const shortCount = stats.puttDetailCounts['pace-short'];
      const direction = longCount > shortCount ? 'long' : 'short';
      insights.push({
        area: 'PUTTING',
        severity: 9,
        title: 'Pace control, not line',
        finding: `${Math.round(pacePct*100)}% of putt misses were pace errors (${stats.paceErrors} of ${detailedTotal}). She\'s reading the line — she\'s misreading the green speed. Bias is ${direction}.`,
        prescription: direction === 'long'
          ? 'Lag putting drill, 40 feet to a 3-foot circle. The goal isn\'t to make it — it\'s to finish inside the circle. 20 reps per session. She\'ll learn to feel a green\'s speed by feel, not memory.'
          : '"Never up, never in" — putt to 17 inches past the hole. Practice 12-foot putts where the target is the BACK of the cup, not the front. Aggressive pace eliminates the leave-short habit.'
      });
    }
    if (stats.overcorrections >= 3) {
      insights.push({
        area: 'PUTTING',
        severity: 8,
        title: 'Overcorrecting on second putt',
        finding: `${stats.overcorrections} times: missed long → then short, or short → then long. She\'s reacting to the first putt instead of trusting her read.`,
        prescription: 'On the second putt, ignore what the first one did. Re-read the green from scratch. The hole hasn\'t moved. The break is the same. Most overcorrections come from "I hit it too hard last time, I\'ll baby this one" — that thinking is the problem.'
      });
    }
  }

  if (puttMissTotal >= 8) {
    const left = stats.puttMissCounts.left;
    const right = stats.puttMissCounts.right;
    const short = stats.puttMissCounts.short;
    const long = stats.puttMissCounts.long;

    if (short / puttMissTotal >= 0.4) {
      insights.push({
        area: 'PUTTING',
        severity: 8,
        title: 'Leaving putts short',
        finding: `${short} of ${puttMissTotal} putt misses came up short (${Math.round(short/puttMissTotal*100)}%). "Never up, never in" — short putts have zero chance.`,
        prescription: 'Practice 12-foot putts to a tee 17 inches BEHIND the hole. Train yourself to roll putts to the back of the cup. The pace difference will eliminate most short misses.'
      });
    }
    if (long / puttMissTotal >= 0.3) {
      insights.push({
        area: 'PUTTING',
        severity: 7,
        title: 'Hitting putts too hard',
        finding: `${long} of ${puttMissTotal} putt misses went long (${Math.round(long/puttMissTotal*100)}%). 3-putts are the score-killer here.`,
        prescription: 'Lag putting drill: 40-foot putts to a 3-foot circle. 20 putts per session. Count how many finish inside the circle. Track the percentage weekly.'
      });
    }
    if ((left + right) / puttMissTotal >= 0.55) {
      const direction = left > right ? 'left' : 'right';
      insights.push({
        area: 'PUTTING',
        severity: 6,
        title: `Putts miss ${direction} most`,
        finding: `${Math.round(Math.max(left,right)/puttMissTotal*100)}% of putt misses are ${direction}. Likely a face angle at impact issue.`,
        prescription: `Gate drill: two tees just wider than your putter head, 6 inches in front of the ball. Hit putts through the gate. Trains square face at impact. Do 50 reps per practice.`
      });
    }
  }

  // --- SCORING vs. baseline ---
  const avgScoreNum = parseFloat(stats.avgScore);
  if (parseInt(stats.avgPutts) > 33) {
    insights.push({
      area: 'PUTTING',
      severity: 9,
      title: 'Putts per round are too high',
      finding: `Averaging ${stats.avgPutts} putts per round. Top D1 players average 29-31. That gap is ${Math.round((parseFloat(stats.avgPutts) - 30))} strokes per round.`,
      prescription: 'Practice putting more than full swing for the next month. 3-putts and short missed putts are the most fixable strokes in your bag right now.'
    });
  }
  if (stats.girPct < 50 && stats.rounds >= 5) {
    insights.push({
      area: 'APPROACH',
      severity: 7,
      title: 'GIR % is below your tier',
      finding: `Hitting ${stats.girPct}% of greens. Elite D1 is 65%+. This is where the biggest score gains live.`,
      prescription: 'Iron play is the bridge to your next scoring tier. Spend more range time on 150-180 yard shots than on driver. Aim to add 5% GIR per quarter.'
    });
  }
  if (stats.scrambleAttempts >= 10 && stats.scramblePct < 35) {
    insights.push({
      area: 'SHORT GAME',
      severity: 8,
      title: 'Short game is leaking strokes',
      finding: `Saving par from off the green only ${stats.scramblePct}% of the time. Elite D1 is 55%+. Roughly ${Math.round((55-stats.scramblePct)/100 * stats.scrambleAttempts * 0.7)} strokes lost across your data set here.`,
      prescription: '30 minutes of short game per range session. 3 stations: 10-yard chip, 25-yard pitch, greenside bunker. Hit 15 from each. This is the lowest-hanging fruit for score reduction.'
    });
  }
  if (parseFloat(stats.avgPenalties) >= 1.5) {
    insights.push({
      area: 'COURSE MGMT',
      severity: 8,
      title: 'Too many penalty strokes',
      finding: `Averaging ${stats.avgPenalties} penalties per round. Each penalty costs ~1.5 strokes. That\'s ${(parseFloat(stats.avgPenalties) * 1.5).toFixed(1)} strokes per round in penalties alone.`,
      prescription: 'Course management, not swing changes, fix this. On any tee shot with OB or water within your shot pattern, take 2 fewer clubs. Score before ego.'
    });
  }

  // --- BUNKER ANALYSIS ---
  if (parseFloat(stats.bunkersPerRound) >= 3) {
    insights.push({
      area: 'COURSE MGMT',
      severity: 7,
      title: 'Finding too many bunkers',
      finding: `Averaging ${stats.bunkersPerRound} bunkers per round (${stats.fairwayBunkers} fairway, ${stats.greensideBunkers} greenside). Tour pros average ~1.5/round. This is a target-selection issue more than a swing one.`,
      prescription: 'Look at your approach shot misses on the Stats tab. If you keep finding bunkers short-right, aim left-center of the green even on a center pin. Take the bunker out of play and let the miss go pin-high in the rough instead.'
    });
  }
  if (stats.sandSaveAttempts >= 5 && stats.sandSavePct < 30) {
    insights.push({
      area: 'SHORT GAME',
      severity: 8,
      title: 'Bunker play is leaking strokes',
      finding: `Saving par from sand only ${stats.sandSavePct}% of the time (${stats.sandSaveSuccess} of ${stats.sandSaveAttempts}). Elite junior girls are at 40%+. Pros at 55%+.`,
      prescription: 'Bunker fundamentals: open the face BEFORE you take your grip, weight 60% forward, hit 2 inches behind the ball, accelerate through. 15 min twice a week in a practice bunker. Sand saves are pure technique — once you have it, it stays.'
    });
  }
  if (stats.greensideBunkers >= 8 && stats.sandSavePct >= 50) {
    insights.push({
      area: 'STRENGTH',
      severity: 3,
      title: 'Your bunker game is a weapon',
      finding: `${stats.sandSavePct}% sand saves on ${stats.sandSaveAttempts} attempts. That\'s elite-level work — keep it sharp.`,
      prescription: 'When you\'re scoring well, bunker play won\'t move the needle. When you\'re scoring badly, knowing you can save par from sand keeps the round from spiraling. Maintain — don\'t over-practice it.'
    });
  }

  // --- DRIVING DISTANCE GAP ---
  if (stats.driveRoundsLogged >= 3 && stats.avgDriveDelta <= -20) {
    insights.push({
      area: 'DISTANCE',
      severity: 7,
      title: 'Driving gap to peers is real',
      finding: `Averaging ${stats.avgDriveDelta} yards behind your playing partners across ${stats.driveRoundsLogged} rounds. At D1, this means 1-2 clubs more into every par 4 and 5 — a real scoring disadvantage that compounds.`,
      prescription: 'Two paths, both worth doing. (1) Speed training: SuperSpeed Golf sticks 3x/week, 10 min sessions. Most junior girls add 8-15 mph clubhead speed in 6 months — that\'s 20-40 yards of carry. (2) Course management to neutralize the gap: hit driver, accept a longer iron in, focus on iron play precision. Distance is fixable; the recruiting clock is not.'
    });
  }
  if (stats.driveRoundsLogged >= 5 && stats.avgDriveDelta >= -10) {
    insights.push({
      area: 'STRENGTH',
      severity: 3,
      title: 'Driving distance not a weakness',
      finding: `Holding within ${Math.abs(stats.avgDriveDelta)} yards of peers across ${stats.driveRoundsLogged} rounds. That\'s competitive distance.`,
      prescription: 'Stop worrying about it. Distance gets the attention but precision wins college tournaments. Lean into your iron play and short game — that\'s where strokes are gained.'
    });
  }

  // Sort by severity, then return top 3-5
  insights.sort((a, b) => b.severity - a.severity);

  return {
    ready: true,
    insights: insights.slice(0, 5),
    totalIssuesFound: insights.length
  };
}

      ${hole.approach && hole.approach !== 'gir' && hole.approach !== 'na' ? `

    ${(hole.approach && hole.approach !== 'gir' && hole.approach !== 'na') ? `
    <div class="entry-block">
      <div class="entry-label">
        <span>Recovery shots${hole.recoveries && hole.recoveries.length ? ' · ' + hole.recoveries.length : ''}</span>
      </div>

      ${(hole.recoveries || []).map((rec, idx) => `
        <div class="recovery-item">

            <button class="recovery-remove" onclick="removeRecovery(${idx})">×</button>
          </div>
          <div class="btn-group cols-3" style="margin-bottom:6px;">
            <button class="data-btn ${rec.result==='holed'?'active good':''}" onclick="setRecoveryResult(${idx},'holed')">Holed</button>
            <button class="data-btn ${rec.result==='good'?'active good':''}" onclick="setRecoveryResult(${idx},'good')">On green ≤6ft</button>
            <button class="data-btn ${rec.result==='okay'?'active warn':''}" onclick="setRecoveryResult(${idx},'okay')">On green 6-15ft</button>
          </div>
          <div class="btn-group cols-3">
            <button class="data-btn ${rec.result==='poor'?'active bad':''}" onclick="setRecoveryResult(${idx},'poor')">On green 15ft+</button>
            <button class="data-btn ${rec.result==='still-off'?'active bad':''}" onclick="setRecoveryResult(${idx},'still-off')">Still off green</button>
            <button class="data-btn ${rec.result==='mishit'?'active bad':''}" onclick="setRecoveryResult(${idx},'mishit')">Mishit</button>
          </div>
        </div>
      `).join('')}

      <button class="add-recovery-btn" onclick="addRecovery()">+ ${hole.recoveries && hole.recoveries.length ? 'Add another recovery' : 'Add ' + (hole.approachBunker ? 'bunker shot' : 'chip/pitch')}</button>
    </div>
    ` : ''}

    <div class="entry-block">
      <div class="entry-label">Putts ${hole.putts !== null && hole.putts !== undefined ? `<span class="entry-label-tag">${hole.putts}</span>` : ''}</div>
      <div class="btn-group cols-5">
        ${[0,1,2,3,4].map(p => `<button class="data-btn ${hole.putts===p?'active':''}" onclick="setPutts(${p})">${p}</button>`).join('')}
      </div>

      ${hole.putts >= 1 ? `
      <div class="putt-detail">
        <div class="putt-section-label">First putt distance</div>
        <div class="btn-group cols-3">
          <button class="data-btn ${hole.firstPuttDistance==='short'?'active':''}" onclick="setFirstPuttDistance('short')">≤6 ft</button>
          <button class="data-btn ${hole.firstPuttDistance==='mid'?'active':''}" onclick="setFirstPuttDistance('mid')">6–20 ft</button>
          <button class="data-btn ${hole.firstPuttDistance==='long'?'active':''}" onclick="setFirstPuttDistance('long')">20+ ft</button>
        </div>
      </div>
      ` : ''}

      ${hole.putts >= 2 ? `
      <div class="putt-detail">
        <div class="putt-section-label">What went wrong on each miss</div>
        ${Array.from({length: hole.putts - 1}, (_, i) => {
          const idx = i;
          const detail = (hole.puttDetails || [])[idx] || null;
          const type = detail ? detail.type : null;
          return `
            <div class="putt-miss-row">
              <div class="putt-miss-label">Putt ${idx + 1}</div>
              <div class="putt-miss-options">
                <button class="putt-detail-btn ${type==='pace-long'?'active warn':''}" onclick="setPuttDetail(${idx}, 'pace-long')">Pace: long</button>
                <button class="putt-detail-btn ${type==='pace-short'?'active warn':''}" onclick="setPuttDetail(${idx}, 'pace-short')">Pace: short</button>
                <button class="putt-detail-btn ${type==='line-left'?'active bad':''}" onclick="setPuttDetail(${idx}, 'line-left')">Line: left</button>
                <button class="putt-detail-btn ${type==='line-right'?'active bad':''}" onclick="setPuttDetail(${idx}, 'line-right')">Line: right</button>
                <button class="putt-detail-btn ${type==='lipped'?'active':''}" onclick="setPuttDetail(${idx}, 'lipped')">Lipped</button>
                <button class="putt-detail-btn ${type==='mishit'?'active bad':''}" onclick="setPuttDetail(${idx}, 'mishit')">Mishit</button>
              </div>
            </div>
          `;
        }).join('')}
        ${(() => {
          // Pattern detection: long-then-short, short-then-long
          const details = (hole.puttDetails || []).slice(0, hole.putts - 1).filter(d => d);
          if (details.length >= 2) {
            const types = details.map(d => d.type);
            if (types[0] === 'pace-long' && types[1] === 'pace-short') {
              return `<div class="putt-pattern">⚠ Long then short — overcorrection on pace. Read the speed of the green better on the first putt.</div>`;
            }
            if (types[0] === 'pace-short' && types[1] === 'pace-long') {
              return `<div class="putt-pattern">⚠ Short then long — overcorrection on pace.</div>`;
            }
            if (types.every(t => t && t.startsWith('pace-'))) {
              return `<div class="putt-pattern">⚠ Pace issue on every putt — green speed misread.</div>`;
            }
            if (types.every(t => t && t.startsWith('line-'))) {
              return `<div class="putt-pattern">⚠ Line issue on every putt — break misread.</div>`;
            }
          }
          return '';
        })()}
      </div>
      ` : ''}
    </div>

    <div class="entry-block">
      <div class="entry-label">Penalties this hole <span class="entry-label-tag">${hole.penalties}</span></div>
      <div class="btn-group cols-4">
        ${[0,1,2,3].map(n => `<button class="data-btn ${hole.penalties===n?'active bad':''}" onclick="setField('penalties',${n})">${n}</button>`).join('')}
      </div>
    </div>

    <div class="entry-block">
      <div class="entry-label">Note for this hole</div>
      <textarea class="notes-input" id="hole-notes" placeholder="Quick — wind, lie, what happened..." oninput="updateHoleNote(this.value)">${escapeHtml(hole.notes || '')}</textarea>
      <div class="quick-tags">
        ${['Wind', 'Bad lie', 'Bad bounce', 'Nerves', 'Lost focus', 'Good swing', 'Pressure'].map(t =>
          `<button class="quick-tag" onclick="appendNote('${t}')">+${t}</button>`).join('')}
      </div>
    </div>

    ${currentHole === 18 || holesPlayed(activeRound) >= 9 ? `
      <button class="finish-btn" onclick="confirmFinish()">Finish round</button>
    ` : ''}
  `;

  // Wire up per-hole drive inputs (if shown)
  const holeDriveYds = document.getElementById('hole-drive-yds');
  if (holeDriveYds) {
    holeDriveYds.addEventListener('input', e => {
      const v = parseInt(e.target.value, 10);
      activeRound.holes[currentHole - 1].driveYds = isNaN(v) ? null : v;
      debouncedSave();
    });
    holeDriveYds.addEventListener('blur', () => renderPlay());
  }
  const holePeerYds = document.getElementById('hole-peer-yds');
  if (holePeerYds) {
    holePeerYds.addEventListener('input', e => {
      const v = parseInt(e.target.value, 10);
      activeRound.holes[currentHole - 1].peerDriveYds = isNaN(v) ? null : v;
      debouncedSave();
    });
    holePeerYds.addEventListener('blur', () => renderPlay());
  }

  const courseInput = document.getElementById('course-input');
  if (courseInput) {
    courseInput.addEventListener('input', e => {
      activeRound.course = e.target.value;
      debouncedSave();
    });
  }

  const teesInput = document.getElementById('tees-input');
  if (teesInput) {
    teesInput.addEventListener('input', e => {
      activeRound.tees = e.target.value;
      debouncedSave();
    });
  }

  const crInput = document.getElementById('cr-input');
  if (crInput) {
    crInput.addEventListener('input', e => {
      const v = parseFloat(e.target.value);
      if (!isNaN(v) && v >= 60 && v <= 80) {
        activeRound.courseRating = v;
        debouncedSave();
      }
    });
  }

  const slopeInput = document.getElementById('slope-input');
  if (slopeInput) {
    slopeInput.addEventListener('input', e => {
      const v = parseInt(e.target.value);
      if (!isNaN(v) && v >= 55 && v <= 155) {
        activeRound.slope = v;
        debouncedSave();
      }
    });
  }
}

function renderDriveTrend(driveDeltas) {
  // Sort chronologically
  const sorted = driveDeltas.slice().sort((a,b) => new Date(a.date) - new Date(b.date));
  const deltas = sorted.map(d => d.delta);
  const max = Math.max(...deltas, 5);
  const min = Math.min(...deltas, -5);
  const absMax = Math.max(Math.abs(max), Math.abs(min), 10);
  const range = absMax * 2;
  const w = 320, h = 110, pad = 12;
  const step = deltas.length === 1 ? 0 : (w - pad*2) / (deltas.length - 1);
  const zeroY = h / 2;

  const points = deltas.map((d, i) => {
    const x = pad + i * step;
    const y = zeroY - (d / absMax) * (h/2 - pad);
    return `${x},${y}`;
  }).join(' ');

  const avg = deltas.reduce((s,v)=>s+v,0) / deltas.length;
  const trend = deltas[deltas.length-1] - deltas[0];
  const trendText = trend > 3 ? '↑ Gap closing' : trend < -3 ? '↓ Gap widening' : '→ Steady';
  const trendColor = trend > 3 ? '#1a3d2e' : trend < -3 ? '#c4452e' : '#6a7570';

  return `
    <div class="viz-section">
      <div class="viz-title">Driving gap · ${deltas.length} round${deltas.length === 1 ? '' : 's'} logged</div>
      <div class="viz-sub" style="color:${trendColor};">${trendText} · avg ${avg > 0 ? '+' : ''}${Math.round(avg)} yds vs peers</div>
      <svg class="trend-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <line x1="${pad}" y1="${zeroY}" x2="${w-pad}" y2="${zeroY}" stroke="rgba(0,0,0,0.2)" stroke-dasharray="2,3"/>
        <text x="${pad+2}" y="${zeroY-3}" font-family="JetBrains Mono" font-size="9" fill="rgba(0,0,0,0.4)">EVEN</text>
        <polyline points="${points}" fill="none" stroke="${trendColor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${deltas.map((d, i) => {
          const x = pad + i * step;
          const y = zeroY - (d / absMax) * (h/2 - pad);
          const fill = d < 0 ? '#c4452e' : d === 0 ? '#6a7570' : '#1a3d2e';
          return `<circle cx="${x}" cy="${y}" r="3.5" fill="${fill}"/>`;
        }).join('')}
      </svg>
      <div style="font-size:11px; color:var(--ink-faint); margin-top:8px; font-style:italic; line-height:1.4;">Recruiting coaches care about this trend. Closing the gap over time tells a stronger story than absolute distance.</div>
    </div>`;
}

function renderTrendChart(rounds) {
  const scores = rounds.map(r => totalScore(r) - totalPar(r));
  const max = Math.max(...scores, 1);
  const min = Math.min(...scores, -1);
  const range = Math.max(max - min, 1);
  const w = 320, h = 100, pad = 12;
  const step = (w - pad*2) / (scores.length - 1);
  const zeroY = h - pad - ((0 - min) / range) * (h - pad*2);
  const points = scores.map((s, i) => {
    const x = pad + i * step;
    const y = h - pad - ((s - min) / range) * (h - pad*2);
    return `${x},${y}`;
  }).join(' ');

  const trend = scores[scores.length-1] - scores[0];
  const trendText = trend < 0 ? '↓ Improving' : trend > 0 ? '↑ Trending up' : '→ Steady';

  return `
    <div class="viz-section">
      <div class="viz-title">Score trend · last ${rounds.length}</div>
      <div class="viz-sub">${trendText} · vs par</div>
      <svg class="trend-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <line x1="${pad}" y1="${zeroY}" x2="${w-pad}" y2="${zeroY}" stroke="rgba(0,0,0,0.1)" stroke-dasharray="2,3"/>
        <polyline points="${points}" fill="none" stroke="#1a3d2e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${scores.map((s, i) => {
          const x = pad + i * step;
          const y = h - pad - ((s - min) / range) * (h - pad*2);
          const fill = s < 0 ? '#c4452e' : s === 0 ? '#f5c842' : '#1a3d2e';
          return `<circle cx="${x}" cy="${y}" r="3" fill="${fill}"/>`;
        }).join('')}
      </svg>
    </div>`;
}

function renderMissPattern(title, misses) {
  const total = Object.values(misses).reduce((s, v) => s + v, 0);
  if (total === 0) return '';

  const cx = 70, cy = 70, rOuter = 60, rInner = 25;
  const segments = [];
  const labels = { left:'Left', right:'Right', wayLeft:'Way L', wayRight:'Way R', short:'Short', long:'Long', chunked:'Chunk', thinned:'Thin', penalty:'Penalty' };
  const positions = {
    left:    { angle: 270, color: '#c4452e' },
    right:   { angle: 90,  color: '#c4452e' },
    wayLeft: { angle: 225, color: '#8a2818' },
    wayRight:{ angle: 135, color: '#8a2818' },
    short:   { angle: 180, color: '#d4a832' },
    long:    { angle: 0,   color: '#d4a832' },
    chunked: { angle: 200, color: '#6a4520' },
    thinned: { angle: 340, color: '#6a4520' },
    penalty: { angle: 270, color: '#000' }
  };

  // Build SVG segments
  const sortedKeys = Object.keys(misses).filter(k => misses[k] > 0).sort((a,b) => misses[b] - misses[a]);

  return `
    <div class="viz-section">
      <div class="viz-title">${title} pattern</div>
      <div class="viz-sub">Where ${total} misses went</div>
      <div class="wheel-wrap">
        <svg class="wheel-svg" viewBox="0 0 140 140">
          ${renderRosePetals(misses, positions, cx, cy, rOuter, rInner)}
          <circle cx="${cx}" cy="${cy}" r="${rInner}" fill="var(--sand)" stroke="var(--rule)" stroke-width="1"/>
          <text x="${cx}" y="${cy+5}" text-anchor="middle" font-family="JetBrains Mono" font-size="14" font-weight="700" fill="#1a3d2e">${total}</text>
        </svg>
        <div class="wheel-legend">
          ${sortedKeys.map(k => `
            <div class="wheel-row">
              <span>${labels[k]||k}</span>
              <span>${misses[k]} · ${Math.round(misses[k]/total*100)}%</span>
            </div>`).join('')}
        </div>
      </div>
    </div>`;
}

function renderRosePetals(misses, positions, cx, cy, rOuter, rInner) {
  const max = Math.max(...Object.values(misses));
  return Object.keys(misses).filter(k => misses[k] > 0).map(k => {
    const pos = positions[k];
    if (!pos) return '';
    const size = rInner + (rOuter - rInner) * (misses[k] / max);
    const angleRad = (pos.angle - 90) * Math.PI / 180;
    const x = cx + Math.cos(angleRad) * size;
    const y = cy + Math.sin(angleRad) * size;
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${pos.color}" stroke-width="14" stroke-linecap="round" opacity="0.75"/>`;
  }).join('');
}

function renderPuttMisses(puttMisses) {
  const total = Object.values(puttMisses).reduce((s,v)=>s+v, 0);
  if (total === 0) return '';
  const labels = { left:'Left', right:'Right', short:'Short', long:'Long', lipped:'Lipped' };
  const max = Math.max(...Object.values(puttMisses));
  return `
    <div class="viz-section">
      <div class="viz-title">Putt miss tendencies</div>
      <div class="viz-sub">Where ${total} missed putts went</div>
      ${Object.keys(puttMisses).filter(k => puttMisses[k] > 0).sort((a,b) => puttMisses[b]-puttMisses[a]).map(k => {
        const pct = max ? Math.round(puttMisses[k]/max*100) : 0;
        return `
          <div class="sg-row">
            <div class="sg-label">${labels[k]}</div>
            <div class="sg-bar-wrap"><div class="sg-bar" style="width:${pct}%"></div></div>
            <div class="sg-value">${puttMisses[k]}</div>
          </div>`;
      }).join('')}
    </div>`;
}

function renderSGStyle(stats) {
  // Compute a simple "where you're losing strokes" — relative to a baseline (good college player)
  const baseline = { score: 74, fairwayPct: 65, girPct: 65, putts: 30, scramblePct: 55 };
  const teeDelta = baseline.fairwayPct - stats.fairwayPct;
  const approachDelta = baseline.girPct - stats.girPct;
  const puttDelta = parseFloat(stats.avgPutts) - baseline.putts;
  const shortDelta = baseline.scramblePct - stats.scramblePct;

  const rows = [
    { label: 'Tee', delta: teeDelta, unit: 'pp behind' },
    { label: 'Approach', delta: approachDelta, unit: 'pp behind' },
    { label: 'Short game', delta: shortDelta, unit: 'pp behind' },
    { label: 'Putting', delta: puttDelta, unit: 'putts over' }
  ];

  const maxAbs = Math.max(...rows.map(r => Math.abs(r.delta)), 1);

  return `
    <div class="viz-section">
      <div class="viz-title">Where you stand vs. elite</div>
      <div class="viz-sub">Gap to top D1 college baseline · negative means you're ahead</div>
      ${rows.map(r => {
        const pct = Math.min(Math.abs(r.delta) / maxAbs * 100, 100);
        const cls = r.delta > 5 ? 'bad' : r.delta > 0 ? 'warn' : 'good';
        const sign = r.delta >= 0 ? '+' : '';
        return `
          <div class="sg-row">
            <div class="sg-label">${r.label}</div>
            <div class="sg-bar-wrap"><div class="sg-bar ${cls}" style="width:${pct}%"></div></div>
            <div class="sg-value">${sign}${r.delta.toFixed(1)}</div>
          </div>`;
      }).join('')}
    </div>`;
}

      </div>
    </div>

    ${result.insights.map((ins, i) => {
      const priorityClass = ins.severity >= 8 ? 'high' : ins.severity >= 5 ? 'med' : '';
      return `
        <div class="insight">

function switchView(view) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + view));

}

async function startRound(courseId) {
  activeRound = newRound(courseId);
  currentHole = 1;
  await storageSet(STORAGE_KEY_ACTIVE, JSON.stringify(activeRound));
  renderPlay();
}

function navHole(dir) {
  const next = currentHole + dir;
  if (next < 1 || next > 18) return;
  currentHole = next;
  renderPlay();
}

function setPar(p) {
  const hole = activeRound.holes[currentHole - 1];
  hole.par = p;
  if (p === 3) hole.tee = null;
  debouncedSave();
  renderPlay();
}

async function resyncCoursePars() {
  if (!activeRound || !activeRound.courseId) {
    showToast('No course library linked to this round');
    return;
  }
  const course = COURSE_LIBRARY[activeRound.courseId];
  if (!course) return;
  let changed = 0;
  activeRound.holes.forEach((h, i) => {
    const libHole = course.holes.find(lh => lh.num === i + 1);
    if (libHole && h.par !== libHole.par) {
      h.par = libHole.par;
      changed++;
    }
  });
  await storageSet(STORAGE_KEY_ACTIVE, JSON.stringify(activeRound));
  showToast(changed ? `Updated ${changed} hole par${changed === 1 ? '' : 's'}` : 'All pars already correct');
  renderPlay();
}

async function linkCourseToRound(courseId) {
  if (!activeRound) return;
  const course = COURSE_LIBRARY[courseId];
  if (!course) return;
  // Link the round to the course
  activeRound.courseId = courseId;
  activeRound.course = course.name;
  const teeData = course.tees[0];
  if (teeData) {
    activeRound.courseRating = teeData.rating;
    activeRound.slope = teeData.slope;
    activeRound.tees = teeData.name;
  }
  // Sync hole pars
  let parsChanged = 0;
  activeRound.holes.forEach((h, i) => {
    const libHole = course.holes.find(lh => lh.num === i + 1);
    if (libHole && h.par !== libHole.par) {
      h.par = libHole.par;
      parsChanged++;
    }
  });
  await storageSet(STORAGE_KEY_ACTIVE, JSON.stringify(activeRound));
  hideModal();
  showToast(`Linked to ${course.name}${parsChanged ? ` · ${parsChanged} pars updated` : ''}`);
  renderPlay();
}

function adjScore(delta) {

  hole.score = Math.max(1, Math.min(15, hole.score + delta));

}
